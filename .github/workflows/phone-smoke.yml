name: NovaClaw Android smoke test

on:
  push:
    branches: [cloud/nova-phone-smoke]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nova-phone-smoke-${{ github.sha }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get APK from the successful build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_run=45686595808
          build_sha=$(gh run view "$build_run" --json headSha --jq .headSha)
          if ! git diff --quiet "$build_sha" HEAD -- app build.gradle.kts settings.gradle.kts gradle.properties; then
            echo "App sources changed. Waiting for the APK from $GITHUB_SHA."
            for attempt in $(seq 1 72); do
              build_run=$(gh run list --workflow build-apk.yml --branch "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId // empty')
              if test -n "$build_run"; then break; fi
              sleep 10
            done
          fi
          test -n "$build_run"
          gh run download "$build_run" -n novaclaw-debug-apk -D app/build/outputs/apk/debug
      - name: Enable emulator acceleration
        run: sudo setfacl -m u:"$USER":rw /dev/kvm
      - name: Download test inputs
        run: |
          mkdir -p smoke-inputs smoke-results
          curl --fail --location --retry 3 --output smoke-inputs/gemma-4-E2B-it.litertlm https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm
          test "$(stat -c %s smoke-inputs/gemma-4-E2B-it.litertlm)" = 2588147712
          curl --fail --location --retry 3 --output smoke-inputs/calculator.apk https://github.com/FossifyOrg/Calculator/releases/download/1.4.0/calculator-10-foss-release.apk
      - name: Verify on-device task on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 6144M
          disk-size: 7G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/cloud-phone-smoke.sh
      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-smoke-evidence
          path: |
            smoke-results
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-smoke-apk
          path: app/build/outputs/apk/debug/app-debug.apk
