name: NovaClaw Android smoke test

on:
  push:
    branches: [cloud/nova-phone-smoke]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-phone-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build app and run JVM tests
        run: |
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)
          test -x "$sdkmanager"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          gradle testDebugUnitTest assembleDebug --console=plain --stacktrace
      - name: Enable emulator acceleration
        run: sudo setfacl -m u:"$USER":rw /dev/kvm
      - name: Download test inputs
        run: |
          mkdir -p smoke-inputs smoke-results
          curl --fail --location --retry 3 --output smoke-inputs/gemma-4-E2B-it.litertlm https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm
          test "$(stat -c %s smoke-inputs/gemma-4-E2B-it.litertlm)" = 2588147712
          curl --fail --location --retry 3 --output smoke-inputs/calculator.apk https://github.com/FossifyOrg/Calculator/releases/download/1.4.0/calculator-10-foss-release.apk
      - name: Verify on-device task on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 6144M
          disk-size: 7G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/cloud-phone-smoke.sh
      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-smoke-evidence
          path: |
            smoke-results
            app/build/reports/tests/testDebugUnitTest
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-smoke-apk
          path: app/build/outputs/apk/debug/app-debug.apk
