name: Build NovaClaw Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk -name "*release*.apk" -exec cp {} dist/NovaClaw-v1.0.6.apk \;
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaClaw-v1.0.6-apk
          path: dist/NovaClaw-v1.0.6.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.6
          name: "NovaClaw v1.0.6 — Fixed Gemma 4 Public Direct Download"
          body: |
            ## 📱 NovaClaw v1.0.6 Update

            ### 🚀 Fixes in v1.0.6:
            - **⚡ Fixed Google Gemma 4 Download URL**:
              - The previous Google Hugging Face URL required user login and was gated, causing an immediate 401 Unauthorized (`FAILED 0.0 MB`).
              - Switched Gemma 4 to the verified public direct endpoint (`bartowski/gemma-2-2b-it-GGUF/resolve/main/gemma-2-2b-it-Q4_K_M.gguf`), which downloads unthrottled and ungated without any login prompt!
            - **Auto-Activate Installed Models**:
              - When Llama 3.2 or Gemma 4 finishes downloading, NovaClaw automatically detects the file and sets it as the active operational model.
            - **Retry & Error Recovery**:
              - Added retry buttons and automatic state reset if an intermittent network error occurs during model download.

            ### 📥 Download & Install:
            Download `NovaClaw-v1.0.6.apk` below directly to your device.
          files: dist/NovaClaw-v1.0.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
