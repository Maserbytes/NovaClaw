name: Build NovaClaw Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} dist/NovaClaw-v1.0.1.apk \;
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaClaw-v1.0.1-apk
          path: dist/NovaClaw-v1.0.1.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.1
          name: "NovaClaw v1.0.1 — Clean Mobile UI & Native Accessibility Integration"
          body: |
            ## 📱 NovaClaw v1.0.1 Update
            
            ### 🛠️ Improvements in v1.0.1:
            - **Native Mobile Viewport Fix**: Completely removed the redundant desktop phone frame mockup when viewed on a phone. The app now natively fills your full mobile screen with zero horizontal overflow or clipping!
            - **Permission Onboarding Banner**: Prominently prompts for **Accessibility Permission** with a 1-tap direct shortcut to Android Settings on launch.
            - **Native Device Automation Bridge**: Connected the UI directly to real phone commands via `AndroidBridge` — real app launching, real gesture tapping, and real screen node perception.
            - **ChatGPT Mobile UI Refinement**: Beautiful clean whitish background, smooth frosted glass cards, collapsible thought accordions, and streamlined quick-prompt cards.
            
            ### 📥 Download & Install:
            Download `NovaClaw-v1.0.1.apk` below directly to your Android phone.
          files: dist/NovaClaw-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
