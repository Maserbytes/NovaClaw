name: Build NovaClaw Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk -name "*release*.apk" -exec cp {} dist/NovaClaw-v1.0.3.apk \;
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaClaw-v1.0.3-apk
          path: dist/NovaClaw-v1.0.3.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.3
          name: "NovaClaw v1.0.3 — Fixed Android Installation & Permanent Signing"
          body: |
            ## 📱 NovaClaw v1.0.3 Update
            
            ### 🔧 Fixes in v1.0.3:
            - **Fixed "Installation failed / Check the APK"**:
              1. **Permanent v1 & v2 Signature**: Generated and bundled a permanent release signing certificate (`release.keystore`) enabling seamless installation across all Android versions without signature mismatch errors.
              2. **OEM Compatibility (ColorOS / OxygenOS / HyperOS)**: Optimized manifest permissions and set targetSdk 33 to prevent OEM package verifier rejections.
            - **ChatGPT Mobile Interface**: Clean home screen ("Where should we start?") with slide-out side drawer `☰`.
            
            ### ⚠️ Important Note Before Installing:
            If you have an earlier attempt of NovaClaw installed on your phone, **please uninstall the previous version first** so Android clears old conflicting signatures.
            
            ### 📥 Download & Install:
            Download `NovaClaw-v1.0.3.apk` below directly to your phone.
          files: dist/NovaClaw-v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
