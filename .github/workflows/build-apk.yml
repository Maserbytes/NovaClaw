name: Build NovaClaw Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk -name "*release*.apk" -exec cp {} dist/NovaClaw-v1.0.10.apk \;
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaClaw-v1.0.10-apk
          path: dist/NovaClaw-v1.0.10.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.10
          name: "NovaClaw v1.0.10 — Unlimited Steps & Full Local AI Model Execution"
          body: |
            ## 📱 NovaClaw v1.0.10 Release: Unlimited Steps & Full Local AI Execution

            ### 🚀 What's New in v1.0.10:
            - **♾️ Removed Maximum Step Limit**:
              - Completely eliminated the artificial 12-step limit!
              - NovaClaw now operates continuously until your autonomous goal is fully accomplished, or until you tap the **Stop** button.
            - **🧠 Full Local AI Model Execution for Everything**:
              - Google Gemma 4 (On-Device Local AI) is now the primary, unrestricted driver for all phone tasks.
              - Every reasoning pill explicitly displays `Step X Reasoning • Gemma 4 Local` with deep chain-of-thought observations.
            - **🔍 Deep Settings & App Navigation**:
              - Increased list search and navigation scans to allow exhaustive exploration of deep OEM menus (OnePlus/ColorOS, Samsung OneUI, Xiaomi HyperOS).
            - **⚡ Live Status Header**:
              - The execution bar displays `Step X • Gemma 4 Active` in real-time.

            ### 📥 Download & Install:
            Download `NovaClaw-v1.0.10.apk` below directly to your phone.
          files: dist/NovaClaw-v1.0.10.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
