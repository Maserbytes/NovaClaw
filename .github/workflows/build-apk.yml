name: Build NovaClaw Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk -name "*release*.apk" -exec cp {} dist/NovaClaw-v1.0.7.apk \;
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaClaw-v1.0.7-apk
          path: dist/NovaClaw-v1.0.7.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.7
          name: "NovaClaw v1.0.7 — Smart Search Navigation & Native Accessibility Scrolling"
          body: |
            ## 📱 NovaClaw v1.0.7 Update

            ### 🚀 Enhancements in v1.0.7:
            - **🔍 Smart Search-First Settings Navigation**:
              - Automatically uses the Settings Search bar to instantly locate buried toggles like **Battery Saver / Power Saving Mode** without getting lost in deep OEM menus (ColorOS, OxygenOS, OneUI).
            - **📜 Native View Hierarchy Scrolling**:
              - Implemented native `ACTION_SCROLL_FORWARD` on Android accessibility scrollable views, ensuring guaranteed list scrolling across all phone manufacturers.
            - **⚡ App Settle Timing**:
              - Increased transition debounce to 1,200ms after app launches, giving apps ample time to render their accessibility node tree before capture.

            ### 📥 Download & Install:
            Download `NovaClaw-v1.0.7.apk` below directly to your phone.
          files: dist/NovaClaw-v1.0.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
