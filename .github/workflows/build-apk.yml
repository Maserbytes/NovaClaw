name: Build NovaClaw Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} dist/NovaClaw-v1.0.2.apk \;
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaClaw-v1.0.2-apk
          path: dist/NovaClaw-v1.0.2.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.2
          name: "NovaClaw v1.0.2 — Authentic ChatGPT Mobile Design & Side Drawer"
          body: |
            ## 📱 NovaClaw v1.0.2 Update
            
            ### ✨ Exact ChatGPT Mobile Design (Images Match):
            - **Clean Minimalist Home Screen**: Replaced crowded cards with the exact ChatGPT mobile layout ("Where should we start?" with simple, clean prompt rows).
            - **Side Drawer Navigation**: All configurations, model switcher, accessibility status, and permissions are tucked neatly into a smooth slide-out side drawer (tap `☰` on top left).
            - **ChatGPT Bottom Pill Bar**: Clean rounded dark pill composer with `+` action button, auto-scaling input, and send icon.
            - **Collapsible Thought Pills**: Compact `💭 Step Reasoning ▾` pills that expand without cluttering the screen.
            
            ### 📥 Download & Install:
            Download `NovaClaw-v1.0.2.apk` below directly to your phone.
          files: dist/NovaClaw-v1.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
