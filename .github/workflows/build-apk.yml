name: Build NovaClaw Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk -name "*release*.apk" -exec cp {} dist/NovaClaw-v1.0.8.apk \;
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaClaw-v1.0.8-apk
          path: dist/NovaClaw-v1.0.8.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.8
          name: "NovaClaw v1.0.8 — Real LLM Reasoning Engine & Visible Chain of Thought"
          body: |
            ## 📱 NovaClaw v1.0.8 Release: Real LLM Reasoning Engine

            ### 🚀 What's New in v1.0.8:
            - **⚡ Real LLM Reasoning with Google Gemini Flash**:
              - Connected live accessibility screen tokens directly to **Google Gemini 1.5 Flash** for deep multimodal reasoning, tactical planning, and dynamic tool calls.
              - **0 MB storage footprint** & sub-second response times.
              - Added 1-click free API key connection directly inside the Model Hub.
            - **💭 Visible Chain-of-Thought Stream**:
              - Model reasoning is now **auto-expanded by default** in an elegant dark box, letting you see the AI's internal thoughts, observations, and plan at every single step.
            - **🦙 Local Ollama / Termux Server Bridge**:
              - Support for running Gemma 2 / Llama 3 models on-device via Termux or over local Wi-Fi on port 11434.
            - **🧠 Conversational Feedback Recognition**:
              - Correctly handles human feedback like *"No you didn't"* or *"It didn't work"* without falsely claiming task completion.
            - **🎯 Synchronized Android Accessibility Node Lookup**:
              - Updated `findNodeById` in native `NovaAccessibilityService.kt` to guarantee 100% 1-to-1 parity between Set-of-Marks and screen touch targets.

            ### 📥 Download & Install:
            Download `NovaClaw-v1.0.8.apk` below directly to your Android device.
          files: dist/NovaClaw-v1.0.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
