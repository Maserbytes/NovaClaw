name: Build NovaClaw Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk -name "*release*.apk" -exec cp {} dist/NovaClaw-v1.0.5.apk \;
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaClaw-v1.0.5-apk
          path: dist/NovaClaw-v1.0.5.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.5
          name: "NovaClaw v1.0.5 — On-Device Model Downloader & Real Execution Engine"
          body: |
            ## 📱 NovaClaw v1.0.5 Major Update

            ### 🚀 What's New & Fixed in v1.0.5:
            - **⚡ Direct Model Downloader**:
              - In-app 1-click **Download & Install Google Gemma 4 (2B INT4)** (1.45 GB) with real-time download progress bar and speed indicator!
              - Also includes **Meta Llama 3.2 (1B Ultra-Light)** (750 MB) for lower storage phones.
              - **Google Gemini Flash Cloud Bridge**: Enter your free Gemini API key to test full autonomous reasoning immediately without waiting for a 1.5 GB download.
              - **Local Ollama / Termux Bridge**: Connect directly to `http://localhost:11434`.
            - **📱 Real Accessibility & Screen Grounding**:
              - Added persistent **Accessibility Setup Banner** and direct **"App Info (3-dots)"** button to bypass Android 14 restricted settings with 1 tap.
              - Action execution halts and clearly alerts the user if Accessibility is disabled or if no model is installed yet, preventing fake ungrounded actions.
              - Conversational responses for greetings and feedback (e.g. "No you didn't") rather than treating every message as an automated phone goal.
            - **Target Android 14 (API 34)**: Permanent release keystore with full Android 14 compatibility.

            ### ⚠️ How to Setup on Android 13/14 (First Launch):
            1. **Install APK** and launch NovaClaw AI.
            2. Tap **"App Info"** on the top yellow banner -> tap the **3 dots `⋮`** in top right -> tap **"Allow restricted settings"** (confirm with PIN/fingerprint).
            3. Tap **"Enable"** -> toggle **NovaClaw AI** to **ON** in Accessibility Settings.
            4. Tap **"Install Model"** -> tap **"Download & Install Gemma 4"** (or paste a Gemini API key for instant zero-download testing).

            ### 📥 Download & Install:
            Download `NovaClaw-v1.0.5.apk` below directly to your device.
          files: dist/NovaClaw-v1.0.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
