name: Build NovaClaw Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk -name "*release*.apk" -exec cp {} dist/NovaClaw-v1.0.9.apk \;
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaClaw-v1.0.9-apk
          path: dist/NovaClaw-v1.0.9.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.9
          name: "NovaClaw v1.0.9 — On-Device Cognitive Reasoner & Model Download Fix"
          body: |
            ## 📱 NovaClaw v1.0.9 Release: On-Device Cognitive Reasoner & Download Fix

            ### 🚀 What's New in v1.0.9:
            - **🛡️ Fixed Re-Download Issue**:
              - When a model (Gemma 4 or Llama 3.2) is already downloaded on your device, the button locks to `✓ Active Model (Ready)` in emerald green.
              - Tapping it never re-downloads; it instantly activates the model.
              - Added dedicated `🗑️ Delete & Re-download` option if you ever need to clear weights.
            - **🧠 On-Device Autonomous Cognitive Reasoner**:
              - Completely eliminates canned "Active screen does not contain elements" errors.
              - Handles conversational chats, typos (like "Hu", "Hi", "Hello"), and general questions directly on-device with friendly NovaClaw responses.
            - **📱 Dynamic App Resolver & Launcher**:
              - You can now launch ANY app installed on your phone (e.g. "Open Camera", "Open YouTube", "Open Settings", "Open Spotify", "Open Chrome") dynamically via native Android Package resolution.
            - **🔍 Screen Search & Deep Navigation**:
              - Automatically locates and types into app search bars or scrolls containers to locate targets like Battery Saver across all Android OEMs (OnePlus, Samsung, Xiaomi, Pixel).

            ### 📥 Download & Install:
            Download `NovaClaw-v1.0.9.apk` below directly to your phone.
          files: dist/NovaClaw-v1.0.9.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
