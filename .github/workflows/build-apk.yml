name: Build NovaClaw Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk -name "*release*.apk" -exec cp {} dist/NovaClaw-v1.0.4.apk \;
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaClaw-v1.0.4-apk
          path: dist/NovaClaw-v1.0.4.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.4
          name: "NovaClaw v1.0.4 — Targeted for Android 14+ (No Older Version Warning)"
          body: |
            ## 📱 NovaClaw v1.0.4 Update

            ### 🚀 What's New & Fixed in v1.0.4:
            - **Target Android 14 (API 34)**: Updated `targetSdk` to 34 and `compileSdk` to 34. This eliminates the *"This app was built for an older version of Android"* warning completely.
            - **Seamless Background Services**: Fixed overlay service lifecycle to conform to Android 14 background service policies.
            - **Permanent Keystore & v1/v2 Signature**: Packaged with a permanent release keystore preventing any installer signature rejections.
            - **ChatGPT Mobile UI**: Dark minimal home screen ("Where should we start?") with slide-out drawer holding model selection, permission setup, and safety logs.

            ### ⚠️ Quick Tip for Android 13/14 Users (Accessibility):
            When enabling NovaClaw in Accessibility Settings on Android 13 or 14:
            If your phone shows **"Restricted setting"**:
            1. Long press the **NovaClaw AI** icon on your home screen -> Tap **App Info** (or Settings > Apps > NovaClaw AI).
            2. Tap the **3 dots** in the top right corner.
            3. Tap **Allow restricted settings**, and verify with your PIN/fingerprint.
            4. Now go to **Accessibility Settings** -> Turn on **NovaClaw AI**.

            ### 📥 Download & Install:
            Download `NovaClaw-v1.0.4.apk` below directly to your device.
          files: dist/NovaClaw-v1.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
